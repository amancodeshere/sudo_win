name: Algorithm Bot CI

on:
  push:
    paths:
      - "algo_bot/**"
      - ".github/workflows/algo-bot-ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algo-bot-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug + sanitizers
            id: gcc-debug
            cc: gcc
            cxx: g++
          - name: Clang Debug + sanitizers
            id: clang-debug
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      BUILD_DIRECTORY: ${{ github.workspace }}/build/${{ matrix.id }}
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake
          -S algo_bot
          -B "$BUILD_DIRECTORY"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build "$BUILD_DIRECTORY" --parallel 2

      - name: Run Catch2 tests
        run: >-
          ctest
          --test-dir "$BUILD_DIRECTORY"
          --output-on-failure
          --no-tests=error

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-test-logs
          path: ${{ env.BUILD_DIRECTORY }}/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  benchmark-tools:
    name: Submission tools + judge sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      UNSWBC_NO_VSCODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned judge toolkit
        run: python -m pip install -r algo_bot/util/requirements.txt
      - name: Test benchmark and packaging tools
        run: python -m unittest discover -s algo_bot/util/tests
      - name: Prepare clean submission sources and official arena
        run: |
          python algo_bot/util/prepare_submission.py algo_bot --output "$RUNNER_TEMP/sudo-win-submission"
          python -c 'import pathlib, shutil, unswbc; shutil.copyfile(pathlib.Path(unswbc.__file__).parent / "templates/maps/arena.map", "arena.map")'
      - name: Verify deterministic sandbox matches
        run: >-
          python algo_bot/util/benchmark.py
          "$RUNNER_TEMP/sudo-win-submission" "$RUNNER_TEMP/sudo-win-submission"
          --maps arena.map --seeds 1 --both-colours --repeat 2
          --output "$RUNNER_TEMP/sudo-win-results"
      - name: Upload sandbox metrics and replays
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-sandbox-results
          path: ${{ runner.temp }}/sudo-win-results/
          if-no-files-found: ignore
          retention-days: 14

  delivery:
    name: Build submission artifact
    needs: [test, benchmark-tools]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BUILD_DIRECTORY: ${{ github.workspace }}/build/release
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure release build
        run: >-
          cmake
          -S algo_bot
          -B "$BUILD_DIRECTORY"
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build release bot and tests
        run: cmake --build "$BUILD_DIRECTORY" --parallel 2

      - name: Run release tests
        run: >-
          ctest
          --test-dir "$BUILD_DIRECTORY"
          --output-on-failure
          --no-tests=error

      - name: Package submission sources
        run: python3 algo_bot/util/prepare_submission.py algo_bot --output dist/sudo-win-algo-bot

      - name: Upload tested bot
        uses: actions/upload-artifact@v4
        with:
          name: sudo-win-algo-bot-${{ github.sha }}
          path: |
            dist/sudo-win-algo-bot.zip
            dist/sudo-win-algo-bot.json
            ${{ env.BUILD_DIRECTORY }}/sudo_win
          if-no-files-found: error
          retention-days: 14
